name: Keep Streamlit App Alive 24/7

on:
  schedule:
    # Runs every 6 hours (4 times a day) to prevent Streamlit Cloud inactivity sleep
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send Browser HTTP Ping to Streamlit App
        run: |
          URLS=(
            "https://3cibvktrrltbwhrdg39ieh.streamlit.app"
            "https://aidataanalyst.streamlit.app"
          )
          
          COOKIE_JAR="/tmp/streamlit_cookies.txt"
          USER_AGENT="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          
          for url in "${URLS[@]}"; do
            echo "Pinging $url ..."
            HTTP_STATUS=$(curl -s -L --max-redirs 10 \
              --connect-timeout 30 \
              --max-time 60 \
              -c "$COOKIE_JAR" \
              -b "$COOKIE_JAR" \
              -A "$USER_AGENT" \
              -o /dev/null \
              -w "%{http_code}" "$url" || echo "ERR")
            echo "Response from $url: HTTP $HTTP_STATUS"
          done
          
          echo "Automated traffic ping completed at $(date)"
