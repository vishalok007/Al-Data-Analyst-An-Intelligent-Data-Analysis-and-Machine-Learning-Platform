name: Keep Streamlit App Alive 24/7

on:
  schedule:
    # Runs every 6 hours (4 times a day) to prevent Streamlit Cloud inactivity sleep
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send Browser HTTP Ping to Streamlit App
        run: |
          curl -s -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" "https://3cibvktrrltbwhrdg39ieh.streamlit.app" > /dev/null
          curl -s -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" "https://aidataanalyst.streamlit.app" > /dev/null
          echo "Automated traffic ping sent successfully to Streamlit Cloud at $(date)"
